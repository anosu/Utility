name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  CI: true
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out shared projects
        shell: bash
        run: |
          git submodule update --init --recursive shared/ModEngineering
      - uses: ./shared/ModEngineering/.github/actions/build
